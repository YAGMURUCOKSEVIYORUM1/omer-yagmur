<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ömer ♥ Yağmur</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');
  :root{
    --bg: #14141c;
    --panel: #14141c;
    --text: #eae6f0;
    --muted: #8b87a0;
    --accent: #ff5c8a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    display:flex; align-items:flex-start; justify-content:center;
    overflow-x:hidden;
  }

  #intro{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(ellipse at 50% 40%, #1c1826 0%, #0b0b10 75%);
    z-index:50;
    overflow:hidden;
    transition: opacity 0.9s ease;
  }
  #intro.fade-out{
    opacity:0;
    pointer-events:none;
  }
  #intro-text{
    position:relative;
    z-index:2;
    font-family:'Pacifico', cursive;
    color:var(--accent);
    text-align:center;
    font-size: clamp(1.5rem, 8vw, 2.6rem);
    line-height:1.55;
    padding: 0 20px;
    text-shadow: 0 0 24px rgba(255,92,138,0.45);
    opacity:0;
    transform: scale(0.85);
    animation: introTextIn 1.6s cubic-bezier(.2,.8,.2,1) forwards 0.3s;
  }
  @keyframes introTextIn{
    0%{ opacity:0; transform:scale(0.8) translateY(10px); }
    60%{ opacity:1; transform:scale(1.04) translateY(0); }
    100%{ opacity:1; transform:scale(1) translateY(0); }
  }
  .floating-heart{
    position:absolute;
    bottom:-40px;
    color: var(--accent);
    opacity:0.85;
    z-index:1;
    animation-name: floatUp;
    animation-timing-function: ease-in;
    animation-iteration-count: infinite;
    filter: drop-shadow(0 0 6px rgba(255,92,138,0.5));
  }
  @keyframes floatUp{
    0%{ transform: translateY(0) translateX(0) rotate(0deg); opacity:0; }
    10%{ opacity:0.9; }
    100%{ transform: translateY(-110vh) translateX(var(--drift,20px)) rotate(25deg); opacity:0; }
  }
  .sparkle{
    position:absolute;
    width:4px; height:4px;
    background:#fff;
    border-radius:50%;
    opacity:0;
    z-index:1;
    animation-name: sparkle;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    box-shadow: 0 0 6px 1px rgba(255,255,255,0.8);
  }
  @keyframes sparkle{
    0%,100%{ opacity:0; transform:scale(0.4); }
    50%{ opacity:1; transform:scale(1.2); }
  }
  .floating-heart.ambient{ opacity:0.35; }
  .sparkle.ambient{ opacity:0; }
  @keyframes sparkleAmbient{
    0%,100%{ opacity:0; transform:scale(0.4); }
    50%{ opacity:0.6; transform:scale(1.1); }
  }

  #main{
    opacity:0;
    transition: opacity 1s ease;
    position:relative;
    width:100%;
    overflow:hidden;
  }
  #main.visible{ opacity:1; }
  #main-fx{
    position:fixed; inset:0;
    pointer-events:none;
    z-index:0;
    overflow:hidden;
  }
  .stage{
    position:relative;
    z-index:2;
    width:100%; max-width:720px;
    padding: max(10px, env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
  }
  h1{
    font-family: 'Pacifico', cursive;
    font-size: clamp(1.7rem, 8vw, 2.2rem);
    font-weight:400; letter-spacing:0.01em;
    line-height:1.4;
    margin:0 0 6px; text-align:center;
    word-break: keep-all;
  }
  h1{ color: var(--accent); }
  p.sub{
    text-align:center; color:var(--muted); margin:0 0 20px;
    font-size:0.92rem; font-family: -apple-system, Helvetica, sans-serif;
  }
  canvas{
    width:100%; max-width:100%; aspect-ratio: 1 / 0.92; display:block;
    background: var(--bg);
    border-radius: 10px;
    position:relative;
    z-index:2;
    touch-action: manipulation;
  }
  .controls{
    display:flex; justify-content:center; gap:12px; margin-top:20px;
    font-family: -apple-system, Helvetica, sans-serif;
    flex-wrap: wrap;
  }
  button{
    background: var(--panel); color: var(--text);
    border: 1px solid #2a2836; border-radius: 999px;
    padding: 12px 22px; font-size: 0.9rem; cursor:pointer;
    min-height:44px;
    transition: border-color 0.15s ease, transform 0.1s ease;
    -webkit-user-select:none; user-select:none;
  }
  button:hover{ border-color: var(--accent); }
  button:active{ transform: scale(0.97); }
  button:focus-visible{ outline: 2px solid var(--accent); outline-offset:2px; }

  @media (max-width: 380px){
    .stage{ padding-left:12px; padding-right:12px; }
    .controls{ gap:10px; }
    button{ padding:11px 18px; font-size:0.85rem; }
  }
</style>
</head>
<body>

<div id="intro">
  <div id="intro-text">Yağmurum<br>Seni Çok Seviyorum<br>Güzelim</div>
</div>

<div id="main">
  <div id="main-fx"></div>
  <div class="stage">
    <h1>Ömer 🖤 Yağmur</h1>
    <canvas id="c" width="700" height="640" aria-label="Merkezden dışarı çizgilerle oluşan kalp deseni animasyonu"></canvas>
    <div class="controls">
      <button id="replay">Yeniden çiz</button>
      <button id="shuffle">Rengi değiştir</button>
    </div>
  </div>
</div>

<script>

const introEl = document.getElementById('intro');

function spawnHeart(){
  const h = document.createElement('div');
  h.className = 'floating-heart';
  h.textContent = Math.random() > 0.5 ? '♥' : '❤';
  const size = 12 + Math.random()*22;
  h.style.left = Math.random()*100 + '%';
  h.style.fontSize = size + 'px';
  h.style.setProperty('--drift', (Math.random()*80 - 40) + 'px');
  const duration = 5 + Math.random()*4;
  h.style.animationDuration = duration + 's';
  introEl.appendChild(h);
  setTimeout(()=> h.remove(), duration*1000 + 200);
}

function spawnSparkle(){
  const s = document.createElement('div');
  s.className = 'sparkle';
  s.style.left = Math.random()*100 + '%';
  s.style.top = Math.random()*100 + '%';
  const duration = 1.2 + Math.random()*1.6;
  s.style.animationDuration = duration + 's';
  introEl.appendChild(s);
  setTimeout(()=> s.remove(), duration*1400);
}

const heartInterval = setInterval(spawnHeart, 260);
const sparkleInterval = setInterval(spawnSparkle, 180);
for(let i=0;i<10;i++) setTimeout(spawnHeart, i*90);

function goToMain(){
  clearInterval(heartInterval);
  clearInterval(sparkleInterval);
  introEl.classList.add('fade-out');
  document.getElementById('main').classList.add('visible');
  setTimeout(()=>{
    introEl.remove();
    if(!started){ started = true; buildPoints(); assignColors(); start(); }
    startAmbientFx();
  }, 950);
}

setTimeout(goToMain, 3400);

function startAmbientFx(){
  const fx = document.getElementById('main-fx');

  function spawnAmbientHeart(){
    const h = document.createElement('div');
    h.className = 'floating-heart ambient';
    h.textContent = Math.random() > 0.5 ? '♥' : '❤';
    const size = 10 + Math.random()*16;
    h.style.left = Math.random()*100 + '%';
    h.style.fontSize = size + 'px';
    h.style.setProperty('--drift', (Math.random()*60 - 30) + 'px');
    const duration = 9 + Math.random()*6;
    h.style.animationDuration = duration + 's';
    fx.appendChild(h);
    setTimeout(()=> h.remove(), duration*1000 + 200);
  }

  function spawnAmbientSparkle(){
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    const duration = 2 + Math.random()*2.4;
    s.style.animationName = 'sparkleAmbient';
    s.style.animationTimingFunction = 'ease-in-out';
    s.style.animationIterationCount = 'infinite';
    s.style.animationDuration = duration + 's';
    fx.appendChild(s);
    setTimeout(()=> s.remove(), duration*2200);
  }

  setInterval(spawnAmbientHeart, 1400);
  setInterval(spawnAmbientSparkle, 500);
  for(let i=0;i<6;i++) setTimeout(spawnAmbientHeart, i*500);
}

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const STEPS = 60;
let points = [];
let colors = [];
let started = false;

function buildPoints(){
  const RESOLUTION = 1440;
  const raw = [];
  for(let i=0;i<RESOLUTION;i++){
    const t = i * (Math.PI*2)/RESOLUTION;
    const x = 16 * Math.pow(Math.sin(t),3);
    const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
    raw.push({x, y});
  }

  const smoothed = raw.map((p, i, arr)=>{
    const prev = arr[(i - 1 + arr.length) % arr.length];
    const next = arr[(i + 1) % arr.length];
    return {
      x: (prev.x + p.x*2 + next.x)/4,
      y: (prev.y + p.y*2 + next.y)/4
    };
  });

  const cum = [0];
  for(let i=1;i<smoothed.length;i++){
    const a = smoothed[i-1], b = smoothed[i];
    cum.push(cum[i-1] + Math.hypot(b.x-a.x, b.y-a.y));
  }
  const totalLen = cum[cum.length-1] + Math.hypot(
    smoothed[0].x - smoothed[smoothed.length-1].x,
    smoothed[0].y - smoothed[smoothed.length-1].y
  );

  points = [];
  for(let i=0;i<STEPS;i++){
    const targetLen = (i / STEPS) * totalLen;
    let idx = 0;
    for(let j=0;j<cum.length;j++){
      if(cum[j] >= targetLen){ idx = j; break; }
      idx = j;
    }
    points.push(smoothed[idx]);
  }
}

const LINE_COLOR_POOL = ["#ff5c8a","#5cc8ff","#7dff9e","#ffe45c","#5cffe4","#c45cff","#ff8f5c"];
let LINE_COLOR = "#ff5c8a";

function assignColors(){
  colors = points.map(()=> LINE_COLOR);
}

const scale = 16.5;
const center = { x: W/2, y: H/2 + 20 };
function toCanvas(p){
  return {
    x: center.x + p.x*scale,
    y: center.y - p.y*scale
  };
}

let animId = null;
let startTime = null;
const GROW_DURATION = 550;
const STAGGER = 26;
const TOTAL_DURATION = GROW_DURATION + STAGGER * (STEPS - 1);

function easeOutCubic(x){
  return 1 - Math.pow(1 - x, 3);
}

function animate(ts){
  if(startTime === null) startTime = ts;
  const elapsed = ts - startTime;

  ctx.clearRect(0,0,W,H);

  const glow = ctx.createRadialGradient(center.x, center.y, 0, center.x, center.y, 40);
  glow.addColorStop(0, "rgba(255,255,255,0.25)");
  glow.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = glow;
  ctx.fillRect(center.x-40, center.y-40, 80, 80);

  ctx.beginPath();
  for(let i=0;i<points.length;i++){
    const lineStart = i * STAGGER;
    const localElapsed = elapsed - lineStart;
    if(localElapsed <= 0) continue;

    const progress = easeOutCubic(Math.min(localElapsed / GROW_DURATION, 1));
    const p = toCanvas(points[i]);
    const x = center.x + (p.x - center.x) * progress;
    const y = center.y + (p.y - center.y) * progress;

    ctx.moveTo(center.x, center.y);
    ctx.lineTo(x, y);
  }
  ctx.strokeStyle = LINE_COLOR;
  ctx.lineWidth = 2.8;
  ctx.globalAlpha = 0.85;
  ctx.stroke();
  ctx.globalAlpha = 1;

  if(elapsed < TOTAL_DURATION){
    animId = requestAnimationFrame(animate);
  }
}

function start(){
  cancelAnimationFrame(animId);
  startTime = null;
  animId = requestAnimationFrame(animate);
}

document.getElementById('replay').addEventListener('click', ()=>{
  buildPoints();
  start();
});
document.getElementById('shuffle').addEventListener('click', ()=>{
  LINE_COLOR = LINE_COLOR_POOL[Math.floor(Math.random()*LINE_COLOR_POOL.length)];
  assignColors();
  start();
});
</script>
</body>
</html>
